<app-header></app-header>

<section class="page-title">
  <span class="tag">trechos & canções</span>

  <h1>Letras</h1>

  <p>músicas que me fizeram pensar.</p>
</section>

<section class="grid">
  <div
    class="card"
    *ngFor="let l of letras"
    (click)="abrir(l)"
    [style.background]="l.cor || '#97A08D'"
  >
    <div class="mini">
      <h4>
        {{ l.musica }}
      </h4>

      <p>
        {{ l.artista }}
      </p>
    </div>

    <div class="trecho">
      {{ l.trecho }}
    </div>
  </div>
</section>

<div
  class="overlay"
  *ngIf="modal"
  (click)="fechar()"
>
  <div
    class="modal"
    [style.background]="selecionada?.cor || '#97A08D'"
    (click)="$event.stopPropagation()"
  >
    <div class="modal-top">
      <h2>{{ selecionada?.musica }}</h2>
      <h4>{{ selecionada?.artista }}</h4>

      <p class="album" *ngIf="selecionada?.album">
        {{ selecionada?.album }}
      </p>
    </div>

    <div class="letra-completa">
      {{ selecionada?.letra }}
    </div>

    <button class="fechar" (click)="fechar()">
      fechar
    </button>
  </div>
</div>

<app-footer></app-footer>
